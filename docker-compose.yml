services:
  mysql:
    image: mysql:8.0
    container_name: pedalup-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pedalup-local-db-password}
      MYSQL_DATABASE: bicycle
    ports:
      - "3307:3306"
    volumes:
      - pedalup_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: ./server
    image: pedalup-server:latest
    container_name: pedalup-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pedalup-local-db-password}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bicycle
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  front:
    build:
      context: ./front
    image: pedalup-front:latest
    container_name: pedalup-front
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5174:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pedalup_mysql_data:
